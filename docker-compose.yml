services:
  app:
    image: common-free:latest
    build: .
    # 只监听回环地址：外网不可直接访问，经 SSH 隧道或前置 nginx 暴露。
    # 若确需公网访问，改成 "8089:3000"，并务必先补上访问控制（见 docs/部署与安全核查报告.md）。
    ports:
      - "127.0.0.1:8089:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      # 只挂数据目录：账号密码不落文件，同步时由界面逐次输入
      - ./data:/app/data
    restart: unless-stopped
    # Adjust the memory limit for the target machine as needed.
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/semesters').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
