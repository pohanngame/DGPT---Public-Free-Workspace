services:
  app:
    image: common-free:latest
    build: .
    # 默认只监听回环地址，外网不可直接访问（SSH 隧道或前置 nginx）。
    # 需要公网直连时不要改本文件，在服务器上建 .env 写 APP_HOST=0.0.0.0（可加 APP_PORT=8089）即可，
    # 这样 git pull 不会产生冲突。
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8089}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      # 只挂数据目录：账号密码不落文件，同步时由界面逐次输入
      - ./data:/app/data
    restart: unless-stopped
    # Adjust the memory limit for the target machine as needed.
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/semesters').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
